      (function() {

        let requestId = 0;
        let callbacksMap = new Map();
        let streamControllers = new Map();
        
        window.claude = {
          complete: (prompt) =&gt; {
            return new Promise((resolve, reject) =&gt; {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'claudeComplete', id, prompt }, '*');

          get: (key, shared = false) =&gt; {
            return new Promise((resolve, reject) =&gt; {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageGet', id, key, shared }, '*');

          set: (key, value, shared = false) =&gt; {
            return new Promise((resolve, reject) =&gt; {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageSet', id, key, value, shared }, '*');
            });
          },
          delete: (key, shared = false) =&gt; {
            return new Promise((resolve, reject) =&gt; {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageDelete', id, key, shared }, '*');
            });
          },
          list: (prefix, shared = false) =&gt; {
            return new Promise((resolve, reject) =&gt; {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageList', id, prefix, shared }, '*');
            });

        let pendingBlobs = new Map();
        URL.createObjectURL = (blob) =&gt; {
          // Store the blob and create an ID and URL for it
          const blobId = `blob-${Date.now()}-${Math.random()}`;
          pendingBlobs.set(blobId, blob);
          return `blob-request://${blobId}`;

        URL.revokeObjectURL = (url) =&gt; {
          // Remove the blob from our store
          const blobId = url.replace(&quot;blob-request://&quot;, &quot;&quot;);

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }

  .tag { font-size: 10px; padding: 2px 8px; border-radius: 12px; border: 1px solid #e0dfd9; color: #73726c; background: #f5f5f3; }

  .places-num { font-weight: 600; color: #555; }

  /* Dates */
  .card-dates { font-size: 11px; color: #555; background: #f9f8f5; border-radius: 6px; padding: 4px 8px; display: flex; align-items: center; gap: 5px; }

// ── render semestre cards ──────────────────────────────────────────────────────
function renderSem(filter) {
  const container = document.getElementById('cards-sem');
  container.innerHTML = '';
  const filtered = semestres.filter(d =&gt;
    filter === 'all' || d.semdetail.some(s =&gt; s.formation === filter)
  );
  document.getElementById('count-sem').textContent =
    filtered.length + ' destination' + (filtered.length &gt; 1 ? 's' : '');
  if (!filtered.length) {
    container.innerHTML = '&lt;div class=&quot;no-results&quot;&gt;Aucune destination pour cette formation.&lt;/div&gt;';
    return;
  }
  filtered.forEach(d =&gt; {
    // unique formations for badges
    const formations = [...new Set(d.semdetail.map(s =&gt; s.formation))];
    const badges = formations.map(f =&gt; {
      const c = badgeColors[f] || { bg:'#eee', color:'#333' };
      return `&lt;span class=&quot;badge&quot; style=&quot;background:${c.bg};color:${c.color}&quot;&gt;${f}&lt;/span&gt;`;
    }).join('');

    // build semester detail rows — merge TC lines with same sem label
    const rows = d.semdetail.map(s =&gt; {
      const c = badgeColors[s.formation] || { bg:'#eee', color:'#333' };
      return `&lt;tr&gt;
        &lt;td&gt;&lt;span class=&quot;sem-tag&quot; style=&quot;background:${c.bg};color:${c.color}&quot;&gt;${s.formation}&lt;/span&gt;&lt;/td&gt;
        &lt;td style=&quot;color:#555;padding-left:4px&quot;&gt;${s.sem}&lt;/td&gt;
        &lt;td style=&quot;text-align:right;font-weight:600;color:${filterColors[s.formation]||'#555'};white-space:nowrap;padding-left:8px&quot;&gt;${s.places} pl.&lt;/td&gt;
      &lt;/tr&gt;`;
    }).join('');

    const datesHtml = d.dates
      ? `&lt;div class=&quot;card-dates&quot;&gt;🗓 ${d.dates}&lt;/div&gt;`
      : `&lt;div class=&quot;card-dates&quot; style=&quot;color:#bbb;font-style:italic&quot;&gt;🗓 Dates à confirmer&lt;/div&gt;`;

    container.innerHTML += `
      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-top&quot;&gt;
          &lt;div class=&quot;card-name&quot;&gt;&lt;a href=&quot;${d.url}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;${d.uni}&lt;/a&gt;&lt;/div&gt;
          &lt;div style=&quot;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0&quot;&gt;
            &lt;span style=&quot;font-size:22px;line-height:1&quot;&gt;${d.flag}&lt;/span&gt;
            &lt;span class=&quot;card-num&quot;&gt;#${d.num}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card-city&quot;&gt;📍 ${d.ville}, ${d.pays}&lt;/div&gt;
        &lt;div class=&quot;badges&quot;&gt;${badges}&lt;span class=&quot;tag&quot;&gt;${d.programme}&lt;/span&gt;&lt;/div&gt;
        ${datesHtml}
        &lt;table class=&quot;semtable&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;
            &lt;th&gt;Formation&lt;/th&gt;
            &lt;th style=&quot;padding-left:4px&quot;&gt;Semestre&lt;/th&gt;
            &lt;th style=&quot;text-align:right;padding-left:8px&quot;&gt;Places&lt;/th&gt;
          &lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;${rows}&lt;/tbody&gt;
        &lt;/table&gt;
        ${d.note ? `&lt;div style=&quot;font-size:10px;color:#bbb&quot;&gt;${d.note}&lt;/div&gt;` : ''}
      &lt;/div&gt;`;
  });
}

// ── render annees cards ───────────────────────────────────────────────────────
function renderAn(filter) {
  const container = document.getElementById('cards-an');
  container.innerHTML = '';
  const filtered = annees.filter(d =&gt;
    filter === 'all' || d.formations.includes(filter)
  );

  if (!filtered.length) {
    container.innerHTML = '&lt;div class=&quot;no-results&quot;&gt;Aucune destination pour cette formation.&lt;/div&gt;';
    return;
  }
  filtered.forEach(d =&gt; {
    const badges = d.formations.map(f =&gt; {
      const c = badgeColors[f] || { bg:'#eee', color:'#333' };
      return `&lt;span class=&quot;badge&quot; style=&quot;background:${c.bg};color:${c.color}&quot;&gt;${f}&lt;/span&gt;`;
    }).join('');
    const placesDetail = Object.entries(d.places)
      .map(([f,n]) =&gt; `&lt;span style=&quot;color:${filterColors[f]||'#555'};font-weight:600&quot;&gt;${f} : ${n}&lt;/span&gt;`)
      .join(' · ');
    const diplomeTag = d.diplome
      ? `&lt;span class=&quot;tag&quot; style=&quot;background:#fff9e6;border-color:#f7d87a;color:#7a5c00&quot;&gt;Double diplôme&lt;/span&gt;`
      : '';
    const datesHtml = d.dates
      ? `&lt;div class=&quot;card-dates&quot;&gt;🗓 ${d.dates}&lt;/div&gt;`
      : `&lt;div class=&quot;card-dates&quot; style=&quot;color:#bbb;font-style:italic&quot;&gt;🗓 Dates à confirmer&lt;/div&gt;`;
    container.innerHTML += `
      &lt;div class=&quot;card${d.diplome ? ' double' : ''}&quot;&gt;
        &lt;div class=&quot;card-top&quot;&gt;
          &lt;div class=&quot;card-name&quot;&gt;&lt;a href=&quot;${d.url}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;${d.uni}&lt;/a&gt;&lt;/div&gt;
          &lt;div style=&quot;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0&quot;&gt;
            &lt;span style=&quot;font-size:22px;line-height:1&quot;&gt;${d.flag}&lt;/span&gt;
            &lt;span class=&quot;card-num&quot;&gt;#${d.num}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card-city&quot;&gt;📍 ${d.ville}, ${d.pays}&lt;/div&gt;
        &lt;div class=&quot;badges&quot;&gt;${badges}${diplomeTag}&lt;/div&gt;
        ${datesHtml}
        &lt;div style=&quot;font-size:11px;color:#999&quot;&gt;🎓 Places BUT3 : ${placesDetail}&lt;/div&gt;
      &lt;/div&gt;`;
  });
}

// ── filters ───────────────────────────────────────────────────────────────────
function filterSem(f, btn) {
  document.querySelectorAll('#tab-semestres .filter-btn').forEach(b =&gt; {
    b.classList.remove('active'); b.style.background=''; b.style.color=''; b.style.borderColor='';
  });
  btn.classList.add('active');
  btn.style.background = filterColors[f] || '#444';
  btn.style.color = (f === 'INFO') ? '#1a1a18' : 'white';
  renderSem(f);
}
function filterAn(f, btn) {
  document.querySelectorAll('#tab-annees .filter-btn').forEach(b =&gt; {
    b.classList.remove('active'); b.style.background=''; b.style.color=''; b.style.borderColor='';
  });
  btn.classList.add('active');
  btn.style.background = filterColors[f] || '#444';
  btn.style.color = (f === 'INFO') ? '#1a1a18' : 'white';
  renderAn(f);
}
function showTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b =&gt; b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p =&gt; p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}

// ── init ──────────────────────────────────────────────────────────────────────
renderSem('all');
renderAn('all');
document.querySelector('#tab-semestres .filter-btn.active').style.background = filterColors['all'];
document.querySelector('#tab-annees .filter-btn.active').style.background = filterColors['all'];
&lt;/script&gt;
&lt;/body&gt;
